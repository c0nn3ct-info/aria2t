name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        # `npm install`, not `npm ci`: Storybook's `oxc-parser` brings
        # platform-specific wasm bindings whose sub-trees npm records only for
        # the platform the lock was written on, and this lock is written on
        # macOS. `npm ci` then refuses on Linux over transitive `@emnapi/*`
        # entries it cannot find. Back to `npm ci` once the lock is generated
        # on Linux, or once the site's Storybook lives in its own package the
        # way the TUI's does.
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    needs: build
    # Deploy only from main; branch builds (e.g. workflow_dispatch on a staging
    # branch) still produce an inspectable artifact but never publish to Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
