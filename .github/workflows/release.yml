name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: '1.25'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - name: Resolve version
        id: out
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${{ inputs.version }}"
          fi
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "invalid version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-version
    defaults:
      run:
        working-directory: tui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin,  arch: arm64, ext: '',     archive: tar.gz }
          - { os: darwin,  arch: amd64, ext: '',     archive: tar.gz }
          - { os: linux,   arch: amd64, ext: '',     archive: tar.gz }
          - { os: linux,   arch: arm64, ext: '',     archive: tar.gz }
          - { os: windows, arch: amd64, ext: '.exe', archive: zip }
          - { os: windows, arch: arm64, ext: '.exe', archive: zip }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build aria2t
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.appVersion=${{ needs.resolve-version.outputs.version }}" \
            -o "dist/aria2t${{ matrix.ext }}" ./cmd/aria2t

      - name: Stage license and readme
        run: |
          cp ../LICENSE dist/
          cp README.md dist/

      - name: Package archive
        id: pack
        env:
          PKG_NAME: aria2t-${{ needs.resolve-version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)/$PKG_NAME"
          mkdir -p "$STAGE"
          cp -r dist/* "$STAGE/"
          cd "$(dirname "$STAGE")"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -qr "$GITHUB_WORKSPACE/$PKG_NAME.zip" "$PKG_NAME"
            echo "asset=$PKG_NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$GITHUB_WORKSPACE/$PKG_NAME.tar.gz" "$PKG_NAME"
            echo "asset=$PKG_NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksum
        working-directory: ${{ github.workspace }}
        run: sha256sum "${{ steps.pack.outputs.asset }}" > "${{ steps.pack.outputs.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (need the tag for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.resolve-version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists, skipping create"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + combined checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec mv {} release/ \;
          cd release
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256

      - name: Build release notes from tag annotation
        env:
          TAG: ${{ needs.resolve-version.outputs.version }}
        run: |
          # The annotated tag message body IS the changelog (written by the mirror sync).
          git fetch --force --tags origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > RELEASE_NOTES.md
          # Lightweight/empty-body tag fallback so the release body is never blank.
          [ -s RELEASE_NOTES.md ] || printf 'Release %s\n' "$TAG" > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: ${{ needs.resolve-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          append_body: false
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
