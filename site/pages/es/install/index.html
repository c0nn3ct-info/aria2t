<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Guía de instalación del cliente de terminal Aria2t: un solo comando instala la última versión; instalación de aria2, compilación desde el código fuente con Go y conexión a un aria2 remoto."
    />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://github.com" />
    <title>Instalar Aria2t — cliente de terminal para aria2 (macOS, Linux, Windows)</title>
    <script>
      (function () {
        try {
          document.documentElement.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../../src/entries/install.tsx"></script>
  </body>
</html>
