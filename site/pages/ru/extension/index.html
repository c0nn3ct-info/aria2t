<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Расширение Chrome для aria2t: magnet-ссылки и крупные загрузки уходят из браузера прямо в тот же демон aria2, которым управляет TUI. Инструкция по установке расширения и нативного хоста."
    />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://github.com" />
    <title>Расширение aria2t для Chrome — загрузки из браузера в aria2</title>
    <script>
      (function () {
        try {
          document.documentElement.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../../src/entries/extension.tsx"></script>
  </body>
</html>
