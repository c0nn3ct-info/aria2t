<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="افزونهٔ Chrome برای Aria2t لینک‌های مگنت و دانلودهای بزرگ مرورگر را به سرور aria2 شما می‌فرستد. با نحوهٔ نصب افزونه و میزبان بومی آشنا شوید."
    />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://github.com" />
    <title>افزونهٔ Chrome برای Aria2t — دانلودهای مرورگر را به aria2 بفرستید</title>
    <script>
      (function () {
        try {
          document.documentElement.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../../src/entries/extension.tsx"></script>
  </body>
</html>
