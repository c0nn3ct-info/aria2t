<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aria2t 下载管理器安装指南：一条命令安装最新版本；aria2 的安装、浏览器扩展的本机主机以及连接远程 aria2。"
    />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://github.com" />
    <title>安装 Aria2t — aria2 下载管理器（macOS、Linux、Windows）</title>
    <script>
      (function () {
        try {
          // The prerender captures <html> with the theme it rendered in, so
          // the shell arrives already carrying one. Clear it before adding the
          // visitor's own: "dark light" painted dark until the app mounted.
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../../src/entries/install.tsx"></script>
  </body>
</html>
