<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Install guide for the Aria2t terminal client: one command installs the latest release binary; aria2 setup, building from source with Go, and connecting to a remote aria2."
    />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://github.com" />
    <title>Install Aria2t — Terminal Client for aria2 (macOS, Linux, Windows)</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('aria2t-locale')) return;
          var l = (navigator.language || '').toLowerCase();
          var loc = 'en';
          if (l.indexOf('ru') === 0) loc = 'ru';
          else if (l.indexOf('zh') === 0) loc = 'zh-CN';
          else if (l.indexOf('es') === 0) loc = 'es';
          else if (l.indexOf('ar') === 0) loc = 'ar';
          else if (l.indexOf('fa') === 0 || l.indexOf('pe') === 0) loc = 'fa';
          localStorage.setItem('aria2t-locale', loc);
          if (loc !== 'en') {
            var p = location.pathname;
            location.replace('/' + loc + (p === '/' ? '/' : p) + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          document.documentElement.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../src/entries/install.tsx"></script>
  </body>
</html>
