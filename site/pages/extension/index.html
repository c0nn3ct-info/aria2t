<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Companion Chrome extension for aria2t: magnet links and large downloads go from the browser straight to the same aria2 daemon the TUI manages. Install guide for the extension and its native host."
    />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://github.com" />
    <title>aria2t Chrome Extension — Send Browser Downloads to aria2</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('aria2t-locale')) return;
          var l = (navigator.language || '').toLowerCase();
          var loc = 'en';
          if (l.indexOf('ru') === 0) loc = 'ru';
          else if (l.indexOf('zh') === 0) loc = 'zh-CN';
          else if (l.indexOf('es') === 0) loc = 'es';
          else if (l.indexOf('de') === 0) loc = 'de';
          else if (l.indexOf('ja') === 0) loc = 'ja';
          localStorage.setItem('aria2t-locale', loc);
          if (loc !== 'en') {
            var p = location.pathname;
            location.replace('/' + loc + (p === '/' ? '/' : p) + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          document.documentElement.classList.add(
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../src/entries/extension.tsx"></script>
  </body>
</html>
